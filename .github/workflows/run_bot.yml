name: Run Ultra Pro Scalper V5

on:
  schedule:
    - cron: '*/15 * * * *' # Har 15 minute me bot apne aap run hoga
  workflow_dispatch: # Aap chahe toh button dabar bhi manually chala sakte hain

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Bot
        run: |
          python bot.py
